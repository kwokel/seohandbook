---
layout: default
---
<h1 class="chapter-title">{{ page.title }}</h1>

<details class="chapter-toc" open hidden>
  <summary class="text-delta">Inhalt</summary>
  <ul id="chapter-toc-list"></ul>
</details>

<div class="chapter-body">
{{ content }}
</div>

<script>
  // Inhaltsverzeichnis automatisch aus den Überschriften des Kapitels erzeugen
  (function () {
    var heads = document.querySelectorAll('.chapter-body h1[id], .chapter-body h2[id], .chapter-body h3[id]');
    if (heads.length < 3) return;
    var levels = Array.prototype.map.call(heads, function (h) { return +h.tagName[1]; });
    var top = Math.min.apply(null, levels);
    var list = document.getElementById('chapter-toc-list');
    heads.forEach(function (h) {
      var li = document.createElement('li');
      li.style.marginLeft = ((+h.tagName[1] - top) * 1.25) + 'rem';
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.trim();
      li.appendChild(a);
      list.appendChild(li);
    });
    list.parentNode.hidden = false;
  })();
</script>
