title: SEO Handbook
description: Ein deutschsprachiges Nachschlagewerk für SEO auf Senior-Niveau – von First Principles bis AI Search.
theme: just-the-docs
lang: de

url: https://kwokel.github.io
permalink: pretty

# Navigation & Suche
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  button: true
search_placeholder_text: Handbuch durchsuchen …

heading_anchors: true
back_to_top: true
back_to_top_text: "Nach oben"
nav_sort: order

aux_links:
  "GitHub": https://github.com/kwokel/seohandbook
aux_links_new_tab: true


exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .pages.yml

defaults:
  - scope:
      path: ""
    values:
      layout: default
