# Konfiguration für Pages CMS (https://pagescms.org)
media:
  input: assets/images
  output: /seohandbook/assets/images

content:
  - name: start
    label: Startseite
    type: file
    path: index.md
    fields:
      - name: title
        label: Titel
        type: string
      - name: layout
        type: string
        hidden: true
        default: home
      - name: nav_order
        type: number
        hidden: true
        default: 0
      - name: body
        label: Inhalt
        description: Enthält Buttons und Links im Jekyll-Format – deshalb als Markdown-Quelltext.
        type: code
        options:
          format: markdown

  - name: handbuch
    label: Handbuch
    type: collection
    path: handbuch
    subfolders: true
    filename: "{primary}.md"
    view:
      fields: [title, nav_order, uebersicht]
      primary: title
      sort: [nav_order, title]
      default:
        sort: nav_order
        order: asc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: nav_order
        label: Position
        description: "Reihenfolge der Unterkapitel im Bereich (1, 2, 3 …). Übersichtsseite: 0"
        type: number
        required: true
        default: 1
      - name: uebersicht
        label: Übersichtsseite des Bereichs
        description: Nur bei genau einer Seite pro Ordner anhaken – alle anderen Seiten im Ordner werden automatisch ihre Unterkapitel.
        type: boolean
        default: false
      - name: bereich_position
        label: Position des Bereichs
        description: "Nur bei der Übersichtsseite: Reihenfolge der Bereiche in der Navigation (Foundations = 1, Search Engines = 2 …)"
        type: number
      - name: body
        label: Inhalt
        description: "Titel und Inhaltsverzeichnis werden automatisch erzeugt. Glossar-Links: ../../glossar/#a – Links auf andere Kapitel im selben Bereich: ../kapitelname/"
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: glossar
    label: Glossar
    type: file
    path: glossar.md
    fields:
      - name: title
        type: string
        hidden: true
        default: Glossar
      - name: nav_order
        type: number
        hidden: true
        default: 12
      - name: layout
        type: string
        hidden: true
        default: chapter
      - name: body
        label: Inhalt
        description: "Buchstaben als Überschrift 2 (## A), Begriffe als Liste."
        type: rich-text
        options:
          format: markdown
          switcher: true
